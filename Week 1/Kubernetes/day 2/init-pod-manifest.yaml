apiVersion: v1
kind: Pod
metadata:
  name: init-container-pod
  namespace: k8s-playground
spec:
  containers:
  initContainers:
    image: busybox:latest
    command: ['/bin/sh' '-c', 'nc -z db-pod 3306' 'if echo $?', 'done']
    image: nginx:alpine
  - name: frontend
    containerPort:
      Port: 80