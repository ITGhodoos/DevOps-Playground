apiVersion: v1
kind: Pod
metadata:
  name: init-container-pod
  namespace: k8s-playground
spec:
  containers:
  - name: frontend
    image: nginx:alpine
    ports:
    - containerPort: 80
  initContainers:
  - name: mysql-check-port
    image: busybox:latest
    command: ['/bin/sh', '-c', 'until nc -z 10.244.2.6 3306; do echo "Waiting for MYSQL"; sleep 2; done']