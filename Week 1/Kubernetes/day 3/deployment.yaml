apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: k8s-playground
  name: frontend-deployment
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: nginx
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80