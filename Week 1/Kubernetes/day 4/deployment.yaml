apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubernetes.io/change-cause: changed nginx image from alpine to 1.22
  namespace: k8s-playground
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.22
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80