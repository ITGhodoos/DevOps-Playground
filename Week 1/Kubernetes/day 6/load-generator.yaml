apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: k8s-playground
spec:
  restartPolicy: Never
  containers:
  - name: load-generator
    containerImage: busybox:latest
    imagePullPolicy: IfNotPresent
    command: [sh, -c, "while true; do wget -q -O- http://frontend-service.k8s-playground.svc.cluster.local; done"]