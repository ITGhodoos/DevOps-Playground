apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-nginx
  namespace: k8s-playground
  labels:
    app: statefulset-nginx
spec:
  serviceName: statefulheadless-service
  replicas: 2

  selector:
    matchLabels:
     app: statefulset-nginx

  template:
    metadata:
      labels:
        app: statefulset-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent

          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            exec:
              command: [ sh, -c, curl localhost:80]
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: statefulheadless-service
  namespace: k8s-playground
spec:
  clusterIP: None
  selector:
    app: statefulset-nginx
  ports:
    - port: 80
      targetPort: 80