apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: k8s-playground
spec:
  ingressClassName: nginx
  rules:
  - host: homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: 
          service:
            name: frontend-service
            port:
              number: 80