clusters:
- name: homelab-cluster
  cluster:
    server: https://<API-SERVER-IP>:6443
    certificate-authority-data: <BASE64-CA-CERT>

users:
- name: cluster-admin
  user:
    client-certificate-data: ca.ca
    client-key: key.key

contexts:
- name: cluster-admin@homelab-cluster
  context:
    cluster: homelab-cluster
    user: cluster-admin
    namespace: k8s-playground

current-context: cluster-admin@homelab-cluster